name: MCU CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO Core Engine
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Compile Target Hardware Binary
      run: |
        # If platformio.ini file is in the root directory:
        pio run